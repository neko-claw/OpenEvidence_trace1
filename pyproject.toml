[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "openevidence-mvp"
version = "0.1.0"
description = "OpenEvidence evidence assistant MVP with A5 trustworthy generation"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "httpx==0.28.1",
  "mcp==2.0.0",
  "pydantic>=2.12,<3",
  "pymupdf>=1.24,<2",
  "PyYAML>=6.0.3,<7",
]

[project.optional-dependencies]
retrieval = [
  "rank-bm25>=0.2",
  "chromadb>=0.4",
]
embedding = [
  "FlagEmbedding>=1.4,<2",
]
dev = [
  "pytest>=8.2,<9",
  "jsonschema>=4.23,<5",
]

[tool.setuptools.packages.find]
include = ["ingestion*", "a1*", "a2*", "a3*", "a5*", "backend*", "retrieval*", "scripts*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
