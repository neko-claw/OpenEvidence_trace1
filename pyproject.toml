[project]
name = "openevidence-mvp"
version = "0.1.0"
description = "OpenEvidence 风格证据智能助手 MVP —— 第一部分：数据集采集（高血压 + 血脂）"
requires-python = ">=3.8"
dependencies = [
    "requests>=2.28",
]

[tool.setuptools.packages.find]
include = ["ingestion*"]

[project.optional-dependencies]
retrieval = ["rank-bm25>=0.2", "chromadb>=0.4"]
