[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "openevidence-mvp"
version = "0.1.0"
description = "OpenEvidence evidence assistant MVP with A5 trustworthy generation"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "requests>=2.28",
  "pydantic>=2.8,<3",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
retrieval = [
  "rank-bm25>=0.2",
  "chromadb>=0.4",
]
dev = [
  "pytest>=8.2,<9",
  "jsonschema>=4.23,<5",
]

[tool.setuptools.packages.find]
include = ["ingestion*", "a1*", "a5*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
